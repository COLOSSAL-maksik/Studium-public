[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "studium"
version = "0.2.0"
description = "Windows-first local teaching records"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "PySide6==6.11.2",
  "SQLAlchemy==2.1.1",
  "alembic==1.20.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-cov==7.1.0", "ruff==0.16.9"]
build = ["pyinstaller==6.22.3"]

[project.gui-scripts]
studium = "studium.presentation.desktop.bootstrap:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["studium", "studium.*"]

[tool.setuptools.package-data]
"studium.infrastructure.database.migrations" = ["script.py.mako", "versions/*.sql"]
"studium.presentation.desktop.help_articles" = ["*.md", "index.json"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["windows: Windows-sensitive contract; also run by the Windows CI job"]
