name: Repository safety
on:
  pull_request:
  push:
    branches: [main]
    tags: ['*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  repository-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # actions/checkout v6.1.0 (Node 24), pinned to an immutable commit.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check tracked paths, materials and secrets
        run: python3 scripts/check_repository_safety.py
      - name: Scan all reachable history
        run: python3 scripts/check_repository_safety.py --history
